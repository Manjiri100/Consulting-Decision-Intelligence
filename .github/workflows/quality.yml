name: Project Quality
on: [push, pull_request]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python -m py_compile scripts/generate_data.py
      - run: python - <<'PY'
import pandas as pd
df=pd.read_csv('data/sample/kpi_observations.csv')
assert df.observation_id.is_unique
assert df.business_unit_id.notna().all()
assert df.kpi_id.notna().all()
print(f'Validated {len(df):,} sample observations')
PY
